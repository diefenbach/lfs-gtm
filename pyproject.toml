[project]
name = "lfs-gtm"
version = "1.0.0"
description = "Google Tag Manager and Consent Mode adapter for Django (pairs with lfs-cookie-consent)"
authors = [
    { name = "Kai Diefenbach", email = "kai.diefenbach@iqpp.de" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8,<3.14"
dependencies = [
    "Django>=3.2,<6.0",
    # Without a consent banner GTM never gets consent, so it comes along.
    "lfs-cookie-consent>=2.0,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-django>=4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.test_project.settings"
pythonpath = [".", "src"]

# Only what belongs to the package: the local notes (recaps/, todos/) and caches stay out of the sdist.
[tool.hatch.build.targets.sdist]
include = ["src/lfs_gtm", "tests", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]
